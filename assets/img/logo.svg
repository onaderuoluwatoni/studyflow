<svg viewBox="0 0 96 96" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="sfLogoTitle2">
  <title id="sfLogoTitle2">StudyFlow — open book flowing into an ascending progress line</title>
  <defs>
    <linearGradient id="sfBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22335a"/>
      <stop offset="100%" stop-color="#0b1526"/>
    </linearGradient>
    <linearGradient id="sfGoldGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3d98a"/>
      <stop offset="50%" stop-color="#c9a227"/>
      <stop offset="100%" stop-color="#8a6512"/>
    </linearGradient>
    <linearGradient id="sfPageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="sfSoftShadow2" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0b1526" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- rounded-square app-icon base -->
  <rect x="3" y="3" width="90" height="90" rx="24" fill="url(#sfBgGrad)"/>
  <rect x="3.75" y="3.75" width="88.5" height="88.5" rx="23.25" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- open book -->
  <g filter="url(#sfSoftShadow2)">
    <path d="M48 34 C41 29, 30 27, 22 29 L22 60 C30 58, 41 60, 48 65 Z" fill="url(#sfPageGrad)"/>
    <path d="M48 34 C55 29, 66 27, 74 29 L74 60 C66 58, 55 60, 48 65 Z" fill="url(#sfPageGrad)"/>
    <path d="M48 34 L48 65" stroke="#c9b98a" stroke-width="1" opacity="0.6"/>
    <path d="M26 36 C31 34.5, 37 34.5, 44 38" stroke="#9aa3b5" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M26 43 C31 41.5, 37 41.5, 44 45" stroke="#9aa3b5" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M26 50 C31 48.5, 36 48.5, 41 51.5" stroke="#9aa3b5" stroke-width="1.4" fill="none" stroke-linecap="round" opacity="0.55"/>
  </g>

  <!-- ascending flow line breaking out of the book, becoming the "growth" mark -->
  <path d="M24 66 C34 66, 40 58, 48 50 C56 42, 64 40, 72 34" fill="none" stroke="url(#sfGoldGrad2)" stroke-width="4.5" stroke-linecap="round" filter="url(#sfSoftShadow2)"/>
  <circle cx="72" cy="34" r="5" fill="url(#sfGoldGrad2)" filter="url(#sfSoftShadow2)"/>
  <path d="M63 33 L73 27 L75 38 Z" fill="url(#sfGoldGrad2)" opacity="0.95"/>
</svg>
